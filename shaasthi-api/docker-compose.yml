services:
  db:
    image: postgres:16-alpine
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shaasthi}
      POSTGRES_USER: ${POSTGRES_USER:-shaasthi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shaasthi}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=100
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shaasthi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shaasthi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py seed_risk_rules &&
      if [ \"$${USE_GUNICORN:-false}\" = \"true\" ]; then
        gunicorn shaasthi_backend.wsgi:application -c gunicorn.conf.py;
      else
        python manage.py runserver 0.0.0.0:8000;
      fi"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DATABASE_URL: ${DATABASE_URL:-postgres://shaasthi:shaasthi@db:5432/shaasthi}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      DB_CONN_MAX_AGE: "60"
      SENTRY_DSN: ${SENTRY_DSN:-}
      THROTTLE_OTP: ${THROTTLE_OTP:-5/min}
      THROTTLE_SYNC_PUSH: ${THROTTLE_SYNC_PUSH:-60/min}
      USE_GUNICORN: ${USE_GUNICORN:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  celery_worker:
    build: .
    command: celery -A shaasthi_backend worker -Q risk_assessment,celery -l info --concurrency=4
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:-postgres://shaasthi:shaasthi@db:5432/shaasthi}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  nginx:
    profiles: ["prod"]
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  shaasthi_postgres:
