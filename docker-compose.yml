version: '3.9'

x-base-env: &base-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?missing required DJANGO_SECRET_KEY}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
  DATABASE_URL: postgresql://${POSTGRES_USER:-saasthi}:${POSTGRES_PASSWORD:-saasthi_dev_password}@postgres:5432/${POSTGRES_DB:-saasthi}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8081}
  GEMMA_API_KEY: ${GEMMA_API_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
  DB_CONN_MAX_AGE: "60"

services:
  postgres:
    image: postgres:16-alpine
    container_name: saasthi_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saasthi}
      POSTGRES_USER: ${POSTGRES_USER:-saasthi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saasthi_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saasthi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saasthi_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saasthi_api
    environment:
      <<: *base-env
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./backend/shaasthi-firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saasthi_celery_worker
    command: celery -A shaasthi_backend worker -Q risk_assessment,celery -l info --concurrency=4
    environment:
      <<: *base-env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/shaasthi-firebase-service-account.json:/run/secrets/firebase-service-account.json:ro

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saasthi_celery_beat
    command: celery -A shaasthi_backend beat -l info --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *base-env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/shaasthi-firebase-service-account.json:/run/secrets/firebase-service-account.json:ro

  nginx:
    image: nginx:alpine
    container_name: saasthi_nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: saasthi_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules:/etc/prometheus/alert.rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  prometheus_data:

networks:
  default:
    name: saasthi_network
