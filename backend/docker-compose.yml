services:
  db:
    image: postgres:16-alpine
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shaasthi}
      POSTGRES_USER: ${POSTGRES_USER:-shaasthi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shaasthi}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=100
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shaasthi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shaasthi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: ${POSTGRES_USER:-shaasthi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shaasthi}
      DB_NAME: ${POSTGRES_DB:-shaasthi}
      DB_HOST: db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py seed_risk_rules &&
      if [ \"$${USE_GUNICORN:-false}\" = \"true\" ]; then
        gunicorn shaasthi_backend.asgi:application -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000 --timeout 60;
      else
        python manage.py runserver 0.0.0.0:8000;
      fi"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DATABASE_URL: ${DATABASE_URL:-postgres://shaasthi:shaasthi@pgbouncer:6432/shaasthi}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      DB_CONN_MAX_AGE: "60"
      SENTRY_DSN: ${SENTRY_DSN:-}
      THROTTLE_OTP: ${THROTTLE_OTP:-5/min}
      THROTTLE_SYNC_PUSH: ${THROTTLE_SYNC_PUSH:-60/min}
      USE_GUNICORN: ${USE_GUNICORN:-true}
      ANYIO_MAX_THREADS: "250"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      pgbouncer:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  celery_worker:
    build: .
    command: celery -A shaasthi_backend worker -Q risk_assessment,celery -l info --concurrency=4
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:-postgres://shaasthi:shaasthi@pgbouncer:6432/shaasthi}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    command: celery -A shaasthi_backend beat -l info --schedule=/tmp/celerybeat-schedule
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:-postgres://shaasthi:shaasthi@pgbouncer:6432/shaasthi}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - shaasthi_beat_data:/data

  db_backup:
    profiles: ["prod"]
    image: postgres:16-alpine
    command: >
      sh -c "
      echo '0 3 * * * /scripts/db_backup.sh /backups' > /etc/crontabs/root &&
      mkdir -p /backups &&
      crond -f -l 2
      "
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-shaasthi}
      POSTGRES_USER: ${POSTGRES_USER:-shaasthi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shaasthi}
    volumes:
      - ./scripts/db_backup.sh:/scripts/db_backup.sh:ro
      - shaasthi_backups:/backups
    depends_on:
      db:
        condition: service_healthy

  nginx:
    profiles: ["prod"]
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  sync_kafka_consumer:
    build: .
    command: python manage.py run_kafka_consumer
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://saasthi_admin:saasthi_pass@db:5432/saasthi
      - CELERY_BROKER_URL=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKER_URL=kafka:9092
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  shaasthi_postgres:
  shaasthi_beat_data:
  shaasthi_backups:
