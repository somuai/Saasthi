[pytest]
DJANGO_SETTINGS_MODULE = shaasthi_backend.settings
python_files = tests.py test_*.py *_tests.py
testpaths = tests followups
addopts = -q --nomigrations --reuse-db --tb=short
markers =
    unit: Pure unit tests, no DB needed
    integration: Requires real DB
    clinical: Clinical safety rules — must never be skipped
    mcp: MCP card specific tests
    ai: AI model and Gemma tests
    slow: Tests taking > 5 seconds
    e2e: Full browser tests, run separately
