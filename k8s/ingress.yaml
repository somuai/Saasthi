apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saasthi-ingress
  namespace: saasthi
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.saasthi.in
      secretName: saasthi-tls-cert
  rules:
    - host: api.saasthi.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saasthi-api-service
                port:
                  number: 8000
