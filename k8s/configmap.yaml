apiVersion: v1
kind: ConfigMap
metadata:
  name: saasthi-config
  namespace: saasthi
  labels:
    app.kubernetes.io/name: saasthi
    app.kubernetes.io/part-of: saasthi-mch
data:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,saasthi-api,api.saasthi.in"
  DATABASE_NAME: "saasthi"
  DATABASE_USER: "saasthi_admin"
  DATABASE_HOST: "saasthi-postgres-service"
  DATABASE_PORT: "5432"
  REDIS_HOST: "saasthi-redis-service"
  REDIS_PORT: "6379"
  DB_CONN_MAX_AGE: "60"
  CORS_ALLOWED_ORIGINS: "https://saasthi.in,https://dashboard.saasthi.in"
  CSRF_TRUSTED_ORIGINS: "https://api.saasthi.in"
  SMS_PROVIDER: "msg91"  # MSG91 is standard for India SMS fallback
