apiVersion: apps/v1
kind: Deployment
metadata:
  name: saasthi-pgbouncer
  namespace: saasthi
  labels:
    app: saasthi-pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saasthi-pgbouncer
  template:
    metadata:
      labels:
        app: saasthi-pgbouncer
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - saasthi-pgbouncer
              topologyKey: kubernetes.io/hostname
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_USER
              value: "saasthi_admin"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: saasthi-secrets
                  key: DATABASE_PASSWORD
            - name: DB_NAME
              value: "saasthi"
            - name: DB_HOST
              value: "saasthi-postgres-service"
            - name: POOL_MODE
              value: "transaction"
            - name: MAX_CLIENT_CONN
              value: "2000"
            - name: DEFAULT_POOL_SIZE
              value: "50"
          ports:
            - containerPort: 6432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: saasthi-pgbouncer-service
  namespace: saasthi
spec:
  ports:
    - port: 6432
      targetPort: 6432
  selector:
    app: saasthi-pgbouncer
