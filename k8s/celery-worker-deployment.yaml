apiVersion: apps/v1
kind: Deployment
metadata:
  name: saasthi-celery-worker
  namespace: saasthi
  labels:
    app: saasthi-celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saasthi-celery-worker
  template:
    metadata:
      labels:
        app: saasthi-celery-worker
    spec:
      containers:
        - name: celery-worker
          image: saasthi-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "shaasthi_backend", "worker", "-Q", "risk_assessment,celery", "-l", "info", "--concurrency=4"]
          env:
            - name: DJANGO_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: saasthi-config
                  key: DJANGO_DEBUG
            - name: DJANGO_ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: saasthi-config
                  key: DJANGO_ALLOWED_HOSTS
            - name: SMS_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: saasthi-config
                  key: SMS_PROVIDER
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: saasthi-secrets
                  key: DJANGO_SECRET_KEY
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: saasthi-secrets
                  key: DATABASE_PASSWORD
            - name: DATABASE_URL
              value: postgresql://saasthi_admin:$(DATABASE_PASSWORD)@saasthi-pgbouncer-service:6432/saasthi
            - name: REDIS_URL
              value: redis://saasthi-redis-service:6379/0
            - name: CELERY_BROKER_URL
              value: redis://saasthi-redis-service:6379/1
            - name: GEMMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: saasthi-secrets
                  key: GEMMA_API_KEY
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: saasthi-secrets
                  key: SENTRY_DSN
            - name: FIREBASE_SERVICE_ACCOUNT_PATH
              value: /run/secrets/firebase-service-account.json
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: firebase-secret-volume
              mountPath: /run/secrets
              readOnly: true
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - shaasthi_backend
                - inspect
                - ping
                - -t
                - "10"
            initialDelaySeconds: 45
            periodSeconds: 60
            timeoutSeconds: 15
      volumes:
        - name: firebase-secret-volume
          secret:
            secretName: saasthi-secrets
            items:
              - key: firebase-service-account.json
                path: firebase-service-account.json
