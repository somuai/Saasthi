name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-prod
  DEBUG: 'False'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saasthi_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Django system check
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/saasthi_test
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py check

      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/saasthi_test
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/saasthi_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

      - name: Lint with ruff
        working-directory: ./backend
        run: ruff check . || true

  frontend-checks:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Type check
        working-directory: ./mobile
        run: npm run type-check || true

      - name: Lint
        working-directory: ./mobile
        run: npm run lint || true

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saasthi_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/saasthi_test
        run: python manage.py migrate

      - name: Check for unapplied migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/saasthi_test
        run: |
          UNAPPLIED=$(python manage.py showmigrations --list | grep -c "^\[ \]" || true)
          if [ "$UNAPPLIED" -gt 0 ]; then
            echo "ERROR: Unapplied migrations found"
            python manage.py showmigrations --list | grep "^\[ \]"
            exit 1
          fi
