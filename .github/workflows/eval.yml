name: SHAASTHI Eval

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:

env:
  DJANGO_DEBUG: "true"
  DJANGO_SECRET_KEY: shaasthi-ci-secret-key-not-for-production
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
  DATABASE_URL: "sqlite:///db.sqlite3"
  CELERY_TASK_ALWAYS_EAGER: "true"
  EXPOSE_DEBUG_OTP: "true"
  THROTTLE_OTP: "30/min"
  APP_VERSION: "0.1.0"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shaasthi
          POSTGRES_PASSWORD: shaasthi
          POSTGRES_DB: shaasthi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt', 'eval/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install mobile deps
        run: cd mobile && npm ci --legacy-peer-deps --ignore-scripts
      - name: Install API deps
        run: |
          cd backend
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt
      - name: Migration consistency check
        run: |
          cd backend
          . .venv/bin/activate
          python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: |
          cd backend
          . .venv/bin/activate
          python manage.py migrate
      - name: Backend lint
        run: |
          cd backend
          . .venv/bin/activate
          ruff check .
      - name: Backend tests
        run: |
          cd backend
          . .venv/bin/activate
          DJANGO_SETTINGS_MODULE=shaasthi_backend.settings python -m pytest -v --timeout 60 -x
      - name: Mobile lint
        run: cd mobile && npx eslint src/
      - name: Mobile tests
        run: cd mobile && npx jest --watchAll=false --passWithNoTests

  offline-eval:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt', 'eval/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install mobile deps
        run: cd mobile && npm ci --legacy-peer-deps --ignore-scripts
      - name: Install API deps
        run: |
          cd backend
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt
          pip install -r ../eval/requirements.txt
          python manage.py migrate
      - name: Run offline eval
        run: make eval-offline
        env:
          DATABASE_URL: sqlite:///db.sqlite3
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: shaasthi-ci-secret-key-not-for-production
          EXPOSE_DEBUG_OTP: "true"
          CELERY_TASK_ALWAYS_EAGER: "true"

  live-eval:
    runs-on: ubuntu-latest
    needs: [offline-eval]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt', 'eval/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install deps
        run: |
          cd mobile && npm ci --legacy-peer-deps --ignore-scripts
          cd ../backend && python -m venv .venv && . .venv/bin/activate && pip install -r requirements-dev.txt
          . .venv/bin/activate && pip install -r ../eval/requirements.txt
          . .venv/bin/activate && python manage.py migrate
      - name: Seed eval data
        run: |
          cd backend
          . .venv/bin/activate
          python manage.py seed_eval_data
      - name: Start API
        run: |
          cd backend
          . .venv/bin/activate
          python manage.py runserver 127.0.0.1:8000 &
          sleep 3
      - name: Live eval tiers
        run: python3 eval/run.py --tier 3 --verbose && python3 eval/run.py --tier 4 --verbose
        env:
          DATABASE_URL: sqlite:///db.sqlite3
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: shaasthi-ci-secret-key-not-for-production
          EXPOSE_DEBUG_OTP: "true"
          CELERY_TASK_ALWAYS_EAGER: "true"
