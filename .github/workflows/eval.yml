name: MEDILIFT Eval

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:

jobs:
  offline-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mobile deps
        run: cd medilift-app && npm ci
      - name: Install API deps
        run: |
          cd medilift-api
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt
          python manage.py migrate
      - name: Run offline eval
        run: make eval-offline

  live-eval:
    runs-on: ubuntu-latest
    needs: offline-eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          cd medilift-app && npm ci
          cd ../medilift-api && python -m venv .venv && . .venv/bin/activate && pip install -r requirements-dev.txt
          pip install -r ../eval/requirements.txt
          python manage.py migrate
      - name: Start API
        run: |
          cd medilift-api
          . .venv/bin/activate
          python manage.py runserver 127.0.0.1:8000 &
          sleep 3
      - name: Live eval tiers
        run: python3 eval/run.py --tier 3 --verbose && python3 eval/run.py --tier 4 --verbose
